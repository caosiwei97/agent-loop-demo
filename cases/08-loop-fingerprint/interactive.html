<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>哈希指纹检测模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e1e;color:#cccccc;font-family:'Courier New',monospace;overflow:hidden}
.container{display:flex;flex-direction:column;height:100%;padding:16px;gap:10px}
h2{color:#569cd6;font-size:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid #333}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-radius:4px 4px 0 0;background:#252526;color:#858585;border:1px solid transparent;border-bottom:none;font-family:inherit}
.tab:hover{color:#cccccc;background:#2d2d2d}
.tab.active{background:#1e1e1e;color:#569cd6;border-color:#333;border-bottom-color:#1e1e1e;position:relative;top:1px}
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column;gap:10px}
.tab-content.active{display:flex}
button{background:#0e639c;color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
button:hover{background:#1177bb}
.controls{display:flex;gap:8px;align-items:center}
.status{color:#6a9955;font-size:12px}
.main{display:flex;flex:1;gap:12px;overflow:hidden}
.panel{flex:1;border:1px solid #333;border-radius:6px;padding:12px;overflow-y:auto;font-size:12px}
.panel-title{color:#569cd6;font-size:11px;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.input-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.input-row label{color:#858585;font-size:11px;min-width:60px}
.input-row input,.input-row textarea{background:#252526;color:#dcdcaa;border:1px solid #444;border-radius:3px;padding:4px 8px;font-family:inherit;font-size:12px;flex:1}
.input-row textarea{height:60px;resize:none}
.fp-result{padding:10px;border:1px solid #333;border-radius:4px;background:#252526;margin-top:8px}
.fp-label{font-size:10px;color:#858585;text-transform:uppercase;margin-bottom:4px}
.fp-value{font-size:16px;color:#dcdcaa;font-weight:bold;letter-spacing:2px}
.fp-detail{font-size:11px;color:#858585;margin-top:4px}
.compare-row{display:flex;gap:12px;margin:6px 0;padding:8px;border-radius:4px;border:1px solid #333;align-items:center}
.compare-row.match{border-color:#22c55e;background:rgba(34,197,94,0.05)}
.compare-row.diff{border-color:#f44747;background:rgba(244,71,71,0.05)}
.compare-label{font-size:10px;color:#858585;min-width:80px}
.compare-val{font-family:inherit;color:#dcdcaa;font-size:11px;word-break:break-all}
.sim-entry{padding:6px 8px;margin:4px 0;border-radius:3px;border-left:3px solid #333;animation:fadeIn .3s}
.sim-normal{border-left-color:#22c55e;background:rgba(34,197,94,0.05)}
.sim-repeat{border-left-color:#f59e0b;background:rgba(245,158,11,0.08)}
.sim-loop{border-left-color:#ef4444;background:rgba(239,68,68,0.08)}
.sim-num{color:#858585;font-size:10px;min-width:20px;display:inline-block}
.sim-tool{color:#569cd6}
.sim-fp{color:#dcdcaa;font-size:10px}
.sim-verdict{font-size:10px;padding:1px 6px;border-radius:2px;margin-left:8px}
.verdict-new{background:#1a3c1a;color:#22c55e}
.verdict-progress{background:#1a2a3c;color:#a5d8ff}
.verdict-loop{background:#3c1a1a;color:#ffc9c9}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="container">
  <h2>哈希指纹检测模拟器</h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">实时计算</div>
    <div class="tab" onclick="switchTab(1)">稳定序列化</div>
    <div class="tab" onclick="switchTab(2)">循环检测模拟</div>
  </div>

  <!-- Tab 0: Real-time calculation -->
  <div class="tab-content active" id="tab0">
    <div class="controls">
      <span class="status">输入工具名和参数，实时计算 SHA256 前 12 位指纹</span>
    </div>
    <div class="main">
      <div class="panel">
        <div class="panel-title">输入</div>
        <div class="input-row">
          <label>工具名:</label>
          <input id="toolName" value="read_file" oninput="calcFingerprint()">
        </div>
        <div class="input-row">
          <label>参数 JSON:</label>
          <textarea id="toolParams" oninput="calcFingerprint()">{"file_path": "src/utils.ts"}</textarea>
        </div>
        <div class="fp-result">
          <div class="fp-label">指纹 (SHA256 前 12 位)</div>
          <div class="fp-value" id="fpOutput">计算中...</div>
          <div class="fp-detail" id="fpDetail"></div>
        </div>
        <div class="fp-result" style="margin-top:8px">
          <div class="fp-label">计算过程</div>
          <div id="fpSteps" style="font-size:11px;color:#858585"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-title">指纹历史</div>
        <div id="fpHistory"></div>
      </div>
    </div>
  </div>

  <!-- Tab 1: Stable serialization -->
  <div class="tab-content" id="tab1">
    <div class="controls">
      <button onclick="runStableDemo()">运行对比</button>
      <span class="status" id="t1status">演示 Object.keys().sort() 如何保证序列化稳定</span>
    </div>
    <div class="main">
      <div class="panel">
        <div class="panel-title">键顺序问题</div>
        <div id="stableDemo"></div>
      </div>
    </div>
  </div>

  <!-- Tab 2: Loop detection simulation -->
  <div class="tab-content" id="tab2">
    <div class="controls">
      <button onclick="runSimulation()">运行模拟</button>
      <button onclick="document.getElementById('simLog').innerHTML=''">清空</button>
      <span class="status" id="t2status">模拟工具调用序列，检测死循环</span>
    </div>
    <div class="main">
      <div class="panel">
        <div class="panel-title">工具调用序列</div>
        <div id="simLog"></div>
      </div>
      <div class="panel" style="flex:0.6">
        <div class="panel-title">统计</div>
        <div id="simStats" style="font-size:12px;color:#858585"></div>
      </div>
    </div>
  </div>
</div>

<script>
function switchTab(idx) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.tab-content').forEach((t,i) => t.classList.toggle('active', i===idx));
}

async function sha256(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function stableStringify(params) {
  const keys = Object.keys(params || {}).sort();
  return JSON.stringify(params, keys);
}

let fpHistoryList = [];

async function calcFingerprint() {
  const name = document.getElementById('toolName').value;
  const paramsStr = document.getElementById('toolParams').value;
  let params;
  try {
    params = JSON.parse(paramsStr);
  } catch(e) {
    document.getElementById('fpOutput').textContent = '(JSON 解析错误)';
    document.getElementById('fpOutput').style.color = '#f44747';
    document.getElementById('fpDetail').textContent = e.message;
    document.getElementById('fpSteps').innerHTML = '';
    return;
  }
  document.getElementById('fpOutput').style.color = '#dcdcaa';

  const stable = stableStringify(params);
  const input = name + stable;
  const hash = await sha256(input);
  const fp = hash.slice(0, 12);

  document.getElementById('fpOutput').textContent = fp;
  document.getElementById('fpDetail').textContent = `完整 SHA256: ${hash}`;
  document.getElementById('fpSteps').innerHTML = `
    <div>1. 排序键: ${JSON.stringify(Object.keys(params).sort())}</div>
    <div>2. 稳定序列化: <span style="color:#ce9178">${stable}</span></div>
    <div>3. 拼接输入: <span style="color:#ce9178">${name}</span> + <span style="color:#6a9955">${stable}</span></div>
    <div>4. SHA256: ${hash.slice(0,24)}...</div>
    <div>5. 取前 12 位: <span style="color:#dcdcaa;font-weight:bold">${fp}</span></div>
  `;

  fpHistoryList.unshift({ name, params: paramsStr, fp, time: new Date().toLocaleTimeString() });
  if (fpHistoryList.length > 10) fpHistoryList.pop();
  renderHistory();
}

function renderHistory() {
  const el = document.getElementById('fpHistory');
  el.innerHTML = fpHistoryList.map((h, i) => `
    <div style="padding:4px 6px;margin:2px 0;background:#252526;border-radius:3px;font-size:11px">
      <span style="color:#858585">${h.time}</span>
      <span style="color:#569cd6">${h.name}</span>
      → <span style="color:#dcdcaa;letter-spacing:1px">${h.fp}</span>
    </div>
  `).join('');
}

async function runStableDemo() {
  const el = document.getElementById('stableDemo');
  el.innerHTML = '';

  const obj1 = { a: 1, b: 2, c: 3 };
  const obj2 = { c: 3, a: 1, b: 2 };
  const obj3 = { b: 2, c: 3, a: 1 };

  const s1 = JSON.stringify(obj1);
  const s2 = JSON.stringify(obj2);
  const s3 = JSON.stringify(obj3);

  const stable1 = stableStringify(obj1);
  const stable2 = stableStringify(obj2);
  const stable3 = stableStringify(obj3);

  const h1 = (await sha256('tool' + stable1)).slice(0, 12);
  const h2 = (await sha256('tool' + stable2)).slice(0, 12);
  const h3 = (await sha256('tool' + stable3)).slice(0, 12);

  el.innerHTML = `
    <div style="margin-bottom:12px;color:#858585;font-size:12px">三个逻辑等价的对象，键顺序不同：</div>
    <div class="compare-row ${s1===s2?'match':'diff'}">
      <span class="compare-label">直接序列化</span>
      <div>
        <div class="compare-val">{a:1, b:2, c:3} → ${s1}</div>
        <div class="compare-val">{c:3, a:1, b:2} → ${s2}</div>
        <div class="compare-val">{b:2, c:3, a:1} → ${s3}</div>
        <div style="margin-top:4px;font-size:10px;color:${s1===s2?'#22c55e':'#f44747'}">
          ${s1===s2&&s2===s3 ? '✓ 全部相同' : '✗ 结果不同! JSON.stringify 不稳定'}
        </div>
      </div>
    </div>
    <div class="compare-row match">
      <span class="compare-label">排序键后</span>
      <div>
        <div class="compare-val">{a:1, b:2, c:3} → ${stable1}</div>
        <div class="compare-val">{c:3, a:1, b:2} → ${stable2}</div>
        <div class="compare-val">{b:2, c:3, a:1} → ${stable3}</div>
        <div style="margin-top:4px;font-size:10px;color:#22c55e">
          ✓ 全部相同! Object.keys().sort() 保证稳定
        </div>
      </div>
    </div>
    <div class="compare-row match">
      <span class="compare-label">指纹结果</span>
      <div>
        <div class="compare-val">fingerprint("tool", {a:1,b:2,c:3}) → <b style="color:#dcdcaa">${h1}</b></div>
        <div class="compare-val">fingerprint("tool", {c:3,a:1,b:2}) → <b style="color:#dcdcaa">${h2}</b></div>
        <div class="compare-val">fingerprint("tool", {b:2,c:3,a:1}) → <b style="color:#dcdcaa">${h3}</b></div>
        <div style="margin-top:4px;font-size:10px;color:#22c55e">
          ✓ 指纹一致 — 键顺序不影响结果
        </div>
      </div>
    </div>
  `;
}

async function runSimulation() {
  const log = document.getElementById('simLog');
  log.innerHTML = '';
  const stats = document.getElementById('simStats');

  const calls = [
    { name: 'read_file', params: {path:'src/index.ts'}, result: '文件内容A(首次)' },
    { name: 'grep_files', params: {pattern:'console.log'}, result: '找到3处匹配' },
    { name: 'read_file', params: {path:'src/utils.ts'}, result: '文件内容B' },
    { name: 'read_file', params: {path:'src/index.ts'}, result: '文件内容A(相同)' },
    { name: 'read_file', params: {path:'src/index.ts'}, result: '文件内容A(相同)' },
    { name: 'grep_files', params: {pattern:'console.log'}, result: '找到3处匹配' },
    { name: 'write_file', params: {path:'src/index.ts',content:'new'}, result: '写入成功' },
    { name: 'read_file', params: {path:'src/index.ts'}, result: '文件内容A(已修改!)' },
  ];

  const history = new Map();
  let noProgressCount = 0;

  for (let i = 0; i < calls.length; i++) {
    const call = calls[i];
    const stable = stableStringify(call.params);
    const input = call.name + stable;
    const callFp = (await sha256(input)).slice(0, 12);
    const resFp = (await sha256(JSON.stringify(call.result))).slice(0, 12);

    let verdict = '', cls = 'sim-normal', verdictCls = 'verdict-new';
    const key = call.name + ':' + callFp;

    if (history.has(key)) {
      const prev = history.get(key);
      if (prev.resFp === resFp) {
        noProgressCount++;
        verdict = '无进展! (同调用+同结果)';
        cls = 'sim-loop';
        verdictCls = 'verdict-loop';
      } else {
        verdict = '有进展 (同调用+不同结果)';
        cls = 'sim-repeat';
        verdictCls = 'verdict-progress';
      }
    } else {
      verdict = '首次出现';
    }

    history.set(key, { resFp, index: i });

    const entry = document.createElement('div');
    entry.className = `sim-entry ${cls}`;
    entry.innerHTML = `
      <span class="sim-num">#${i+1}</span>
      <span class="sim-tool">${call.name}</span>(${JSON.stringify(call.params)})
      <br><span class="sim-fp">调用指纹: ${callFp} | 结果指纹: ${resFp}</span>
      <span class="sim-verdict ${verdictCls}">${verdict}</span>
    `;
    log.appendChild(entry);

    stats.innerHTML = `
      <div>总调用: ${i+1}</div>
      <div>唯一指纹: ${history.size}</div>
      <div style="color:${noProgressCount>0?'#f44747':'#22c55e'}">无进展次数: ${noProgressCount}</div>
      <div style="margin-top:8px;color:#858585;font-size:11px">
        规则:<br>
        调用指纹相同 + 结果相同 = 死循环<br>
        调用指纹相同 + 结果不同 = 合法轮询
      </div>
    `;

    await new Promise(r => setTimeout(r, 500));
  }

  document.getElementById('t2status').textContent = `模拟完成: ${calls.length} 次调用，${noProgressCount} 次无进展`;
}

calcFingerprint();
</script>
</body>
</html>
