<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>边说边执行模拟器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e1e;color:#cccccc;font-family:'Courier New',monospace;overflow:hidden}
.container{display:flex;flex-direction:column;height:100%;padding:16px;gap:10px}
h2{color:#569cd6;font-size:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid #333}
.tab{padding:8px 16px;font-size:12px;cursor:pointer;border-radius:4px 4px 0 0;background:#252526;color:#858585;border:1px solid transparent;border-bottom:none;font-family:inherit}
.tab:hover{color:#cccccc;background:#2d2d2d}
.tab.active{background:#1e1e1e;color:#569cd6;border-color:#333;border-bottom-color:#1e1e1e;position:relative;top:1px}
.tab-content{display:none;flex:1;overflow:hidden;flex-direction:column;gap:10px}
.tab-content.active{display:flex}

button{background:#0e639c;color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
button:hover{background:#1177bb}
button:disabled{background:#333;color:#777;cursor:not-allowed}
.controls{display:flex;gap:8px;align-items:center}
.status{color:#6a9955;font-size:12px}

.timeline{flex:1;overflow-y:auto;position:relative;padding:10px}
.timeline-row{display:flex;align-items:center;margin:3px 0;animation:fadeIn .3s;font-size:11px}
.timeline-time{min-width:50px;color:#858585;text-align:right;margin-right:10px}
.timeline-bar{height:22px;border-radius:3px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;font-size:11px}
.bar-model{background:#2a4a6b;color:#a5d8ff;border:1px solid #4a9eed}
.bar-tool{background:#2a4a2a;color:#b2f2bb;border:1px solid #22c55e}
.bar-wait{background:#333;color:#858585;border:1px solid #555;border-style:dashed}

.legend{display:flex;gap:16px;font-size:11px;color:#858585;border-top:1px solid #333;padding-top:6px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:2px}

.summary{padding:10px;border:1px solid #333;border-radius:4px;background:#252526;font-size:12px;margin-top:8px}
.summary-title{color:#569cd6;font-size:11px;margin-bottom:4px}
.summary-row{display:flex;justify-content:space-between;padding:2px 0}
.summary-val{color:#dcdcaa}
.summary-good{color:#22c55e}
.summary-bad{color:#f59e0b}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="container">
  <h2>边说边执行 — 流水线 vs 串行对比</h2>
  <div class="tabs">
    <div class="tab active" onclick="switchTab(0)">串行模式</div>
    <div class="tab" onclick="switchTab(1)">流水线模式</div>
  </div>

  <!-- Tab 0: Serial -->
  <div class="tab-content active" id="tab0">
    <div class="controls">
      <button onclick="runSerial()">运行串行模式</button>
      <button onclick="resetTab(0)">重置</button>
      <span class="status" id="t0status">等整条消息说完，再依次执行工具</span>
    </div>
    <div class="timeline" id="t0timeline"></div>
    <div id="t0summary"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2a4a6b"></div>模型生成</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2a4a2a"></div>工具执行</div>
      <div class="legend-item"><div class="legend-dot" style="background:#333;border:1px dashed #555"></div>等待</div>
    </div>
  </div>

  <!-- Tab 1: Pipeline -->
  <div class="tab-content" id="tab1">
    <div class="controls">
      <button onclick="runPipeline()">运行流水线模式</button>
      <button onclick="resetTab(1)">重置</button>
      <span class="status" id="t1status">工具块一完成就执行，与后续生成重叠</span>
    </div>
    <div class="timeline" id="t1timeline"></div>
    <div id="t1summary"></div>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#2a4a6b"></div>模型生成</div>
      <div class="legend-item"><div class="legend-dot" style="background:#2a4a2a"></div>工具执行</div>
    </div>
  </div>
</div>

<script>
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function switchTab(idx){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.querySelectorAll('.tab-content').forEach((t,i)=>t.classList.toggle('active',i===idx));
}

function addRow(container, time, text, cls, width) {
  const row = document.createElement('div');
  row.className = 'timeline-row';
  row.innerHTML = `<span class="timeline-time">${time}</span><div class="timeline-bar ${cls}" style="width:${width}px">${text}</div>`;
  container.appendChild(row);
  row.scrollIntoView({behavior:'smooth',block:'nearest'});
}

let t0running=false, t1running=false;

// === Serial mode ===
async function runSerial() {
  if(t0running) return;
  t0running = true;
  const tl = document.getElementById('t0timeline');
  document.getElementById('t0status').textContent = '运行中...';
  let t = 0;

  // Model generates all tool calls first
  addRow(tl, `${t}ms`, '模型生成: 文本 + tool_call(Read A)', 'bar-model', 200);
  await sleep(400); t += 400;
  addRow(tl, `${t}ms`, '模型生成: tool_call(Read B)', 'bar-model', 160);
  await sleep(300); t += 300;
  addRow(tl, `${t}ms`, '模型生成: tool_call(Read C)', 'bar-model', 160);
  await sleep(300); t += 300;
  addRow(tl, `${t}ms`, '模型生成: message_stop', 'bar-model', 120);
  await sleep(200); t += 200;

  // Now execute tools one by one
  addRow(tl, `${t}ms`, '等待: 模型生成完毕，开始执行工具...', 'bar-wait', 250);
  await sleep(200); t += 200;

  addRow(tl, `${t}ms`, '执行 Read A (150ms)', 'bar-tool', 150);
  await sleep(400); t += 150;
  addRow(tl, `${t}ms`, '执行 Read B (100ms)', 'bar-tool', 100);
  await sleep(300); t += 100;
  addRow(tl, `${t}ms`, '执行 Read C (120ms)', 'bar-tool', 120);
  await sleep(350); t += 120;

  const total = t;
  document.getElementById('t0summary').innerHTML = `
    <div class="summary">
      <div class="summary-title">串行模式耗时分析</div>
      <div class="summary-row"><span>模型生成</span><span class="summary-val">1200ms</span></div>
      <div class="summary-row"><span>等待 (模型说完才执行)</span><span class="summary-bad">+200ms 空转</span></div>
      <div class="summary-row"><span>工具执行 (A+B+C 串行)</span><span class="summary-val">370ms</span></div>
      <div class="summary-row"><span>总耗时</span><span class="summary-bad">${total}ms</span></div>
    </div>`;
  document.getElementById('t0status').textContent = `完成 — 总耗时 ${total}ms (生成和执行完全不重叠)`;
  t0running = false;
}

// === Pipeline mode ===
async function runPipeline() {
  if(t1running) return;
  t1running = true;
  const tl = document.getElementById('t1timeline');
  document.getElementById('t1status').textContent = '运行中...';
  let t = 0;

  addRow(tl, `${t}ms`, '模型生成: 文本 + tool_call(Read A)', 'bar-model', 200);
  await sleep(400); t += 400;

  // Tool A starts immediately after its block completes
  addRow(tl, `${t}ms`, '→ Read A 块完成，立即执行 (150ms)', 'bar-tool', 150);
  // Meanwhile model continues generating
  addRow(tl, `${t}ms`, '模型继续: tool_call(Read B)', 'bar-model', 160);
  await sleep(300); t += 300;

  addRow(tl, `${t}ms`, '→ Read B 块完成，立即执行 (100ms)', 'bar-tool', 100);
  addRow(tl, `${t}ms`, '模型继续: tool_call(Read C)', 'bar-model', 160);
  await sleep(300); t += 300;

  addRow(tl, `${t}ms`, '→ Read C 块完成，立即执行 (120ms)', 'bar-tool', 120);
  addRow(tl, `${t}ms`, '模型生成: message_stop', 'bar-model', 120);
  await sleep(300); t += 200;

  // In pipeline mode, tool execution overlaps with generation
  // Total = max(generation_time, last_tool_finish)
  // Generation: 1200ms, Tools all start during generation and finish within
  const pipelineTotal = 1200; // tools finish within the generation window

  document.getElementById('t1summary').innerHTML = `
    <div class="summary">
      <div class="summary-title">流水线模式耗时分析</div>
      <div class="summary-row"><span>模型生成</span><span class="summary-val">1200ms</span></div>
      <div class="summary-row"><span>工具执行 (与生成重叠)</span><span class="summary-good">+0ms (全部在生成窗口内完成)</span></div>
      <div class="summary-row"><span>总耗时</span><span class="summary-good">~${pipelineTotal}ms</span></div>
      <div class="summary-row"><span>相比串行节省</span><span class="summary-good">~370ms (减少 24%)</span></div>
    </div>`;
  document.getElementById('t1status').textContent = `完成 — 总耗时 ~${pipelineTotal}ms (工具执行被模型生成"吃掉"了)`;
  t1running = false;
}

function resetTab(idx) {
  document.getElementById(`t${idx}timeline`).innerHTML = '';
  document.getElementById(`t${idx}summary`).innerHTML = '';
  if(idx===0) { t0running=false; document.getElementById('t0status').textContent='等整条消息说完，再依次执行工具'; }
  if(idx===1) { t1running=false; document.getElementById('t1status').textContent='工具块一完成就执行，与后续生成重叠'; }
}
</script>
</body>
</html>
