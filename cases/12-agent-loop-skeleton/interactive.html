<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Loop 架构 — 力导向图</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e1e;color:#cccccc;font-family:'Courier New',monospace;overflow:hidden}
.container{display:flex;flex-direction:column;height:100%;padding:16px;gap:10px}
h2{color:#569cd6;font-size:16px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#0e639c;color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
button:hover{background:#1177bb}
button:disabled{background:#333;color:#777;cursor:not-allowed}
button.active{background:#8b5cf6}
.status{color:#6a9955;font-size:12px}
.main{display:flex;flex:1;gap:12px;overflow:hidden}
.graph-panel{flex:2;border:1px solid #333;border-radius:6px;overflow:hidden;position:relative}
.info-panel{flex:0.8;border:1px solid #333;border-radius:6px;padding:12px;overflow-y:auto;font-size:11px}
.panel-title{color:#569cd6;font-size:11px;margin-bottom:6px;border-bottom:1px solid #333;padding-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
svg{width:100%;height:100%}
.node{cursor:pointer}
.node circle{stroke-width:2;transition:fill .3s,stroke .3s,r .3s}
.node text{fill:#cccccc;font-size:9px;pointer-events:none}
.link{stroke:#444;stroke-width:1.2;fill:none;marker-end:url(#arrowG)}
.link-active{stroke:#4a9eed;stroke-width:2.5;filter:drop-shadow(0 0 3px #4a9eed)}
.tooltip{position:absolute;background:#252526;border:1px solid #555;border-radius:4px;padding:6px 10px;font-size:11px;pointer-events:none;display:none;z-index:10;max-width:220px}
.detail-card{padding:8px;border:1px solid #333;border-radius:4px;background:#252526;margin-bottom:8px}
.detail-title{font-weight:bold;margin-bottom:3px}
.legend{position:absolute;bottom:8px;left:8px;display:flex;gap:10px;font-size:9px;color:#858585}
.legend-item{display:flex;align-items:center;gap:3px}
.legend-dot{width:8px;height:8px;border-radius:50%}
.sim-log{margin-top:8px;max-height:200px;overflow-y:auto}
.sim-entry{padding:3px 6px;margin:2px 0;border-radius:2px;font-size:10px;animation:fadeIn .2s}
.sim-active{background:#1a2a3c;color:#a5d8ff;border-left:2px solid #4a9eed}
.sim-fuse{background:#3c1a1a;color:#ffc9c9;border-left:2px solid #ef4444}
.sim-ok{background:#1a3c1a;color:#b2f2bb;border-left:2px solid #22c55e}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="container">
  <h2>Agent Loop 架构 — 力导向交互图</h2>
  <div class="controls">
    <button class="active" id="btnAll" onclick="showAll()">全景</button>
    <button id="btnFuse" onclick="highlightFuses()">三根保险丝</button>
    <button id="btnExit" onclick="highlightExits()">七种退出</button>
    <button onclick="runSimulation()">模拟执行</button>
    <button onclick="resetHighlight()">重置高亮</button>
    <span class="status" id="statusText">拖拽节点、悬停查看详情、点击按钮聚焦不同子系统</span>
  </div>
  <div class="main">
    <div class="graph-panel" id="graphPanel">
      <svg id="graphSvg"></svg>
      <div class="tooltip" id="tooltip"></div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#569cd6"></div>核心循环</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>保险丝</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>退出路径</div>
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>工具系统</div>
        <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>容错</div>
      </div>
    </div>
    <div class="info-panel">
      <div class="panel-title">节点详情</div>
      <div id="detailArea">
        <div style="color:#858585">点击或悬停节点查看详情</div>
      </div>
      <div class="panel-title" style="margin-top:12px">模拟日志</div>
      <div class="sim-log" id="simLog"></div>
    </div>
  </div>
</div>
<script>
const graphNodes = [
  { id: 'loop', label: 'Agent Loop', group: 'core', desc: 'while(true) 主循环。每轮：检测→调用模型→处理输出→执行工具→检查退出条件。', size: 24 },
  { id: 'model', label: '调用模型', group: 'core', desc: '发送 messages 给 LLM API，获取流式响应。容错机制在此生效。', size: 16 },
  { id: 'toolexec', label: '工具执行器', group: 'tool', desc: '解析工具调用，判断并发安全性（读并发/写串行），执行工具并收集结果。', size: 16 },
  { id: 'streaming', label: '流式解析', group: 'tool', desc: '从 SSE 流中拼接 JSON 碎片，识别完整的 tool_use 块。边解析边触发执行。', size: 14 },
  { id: 'concurrency', label: '并发调度', group: 'tool', desc: 'Read/Glob/Grep 可并发，Edit 独占执行，Bash 按具体命令判断。', size: 14 },
  { id: 'fuse1', label: '死循环检测', group: 'fuse', desc: '四种检测器：通用重复(10次告警)、无进展轮询、Ping-Pong交替、全局熔断(30次强停)。', size: 16 },
  { id: 'fuse2', label: 'Token预算', group: 'fuse', desc: '90%时注入nudge消息"继续工作不要总结"。检测递减回报：连续两轮<500Token则停止。', size: 16 },
  { id: 'fuse3', label: '截断恢复', group: 'fuse', desc: '三步恢复：提高上限(8K→64K)→注入恢复消息(最多3次)→认栽返回不完整结果。', size: 16 },
  { id: 'retry', label: '重试+退避', group: 'fault', desc: '指数退避(500ms×2^n)+随机抖动。优先使用 Retry-After 头。最多10次。', size: 14 },
  { id: 'degrade', label: '三层降级', group: 'fault', desc: '流式→非流式→换模型。失败预算连续，不是各算各的。', size: 14 },
  { id: 'exit_completed', label: 'completed', group: 'exit', desc: 'end_turn: 模型认为任务完成。', size: 11 },
  { id: 'exit_maxturns', label: 'max_turns', group: 'exit', desc: '跑满轮次上限。检查发生在工具执行完成后。', size: 11 },
  { id: 'exit_abort_s', label: 'abort_stream', group: 'exit', desc: '用户按Esc(模型输出时)。保留已收到文本。', size: 11 },
  { id: 'exit_abort_t', label: 'abort_tools', group: 'exit', desc: '用户按Esc(工具执行时)。等正在跑的工具完成。', size: 11 },
  { id: 'exit_hook', label: 'hook_stopped', group: 'exit', desc: '自定义Hook阻止。如CI环境中lint不通过。', size: 11 },
  { id: 'exit_block', label: 'blocking_limit', group: 'exit', desc: '上下文快满，发请求前预检拦截。', size: 11 },
  { id: 'exit_long', label: 'prompt_too_long', group: 'exit', desc: 'API返回413。先尝试Context Collapse和Reactive Compact。', size: 11 },
];

const graphLinks = [
  { source: 'loop', target: 'model' },
  { source: 'model', target: 'streaming' },
  { source: 'model', target: 'retry' },
  { source: 'model', target: 'degrade' },
  { source: 'streaming', target: 'toolexec' },
  { source: 'toolexec', target: 'concurrency' },
  { source: 'toolexec', target: 'loop' },
  { source: 'loop', target: 'fuse1' },
  { source: 'loop', target: 'fuse2' },
  { source: 'model', target: 'fuse3' },
  { source: 'loop', target: 'exit_completed' },
  { source: 'loop', target: 'exit_maxturns' },
  { source: 'loop', target: 'exit_abort_s' },
  { source: 'loop', target: 'exit_abort_t' },
  { source: 'loop', target: 'exit_hook' },
  { source: 'loop', target: 'exit_block' },
  { source: 'loop', target: 'exit_long' },
];

const groupColors = { core: '#569cd6', fuse: '#ef4444', exit: '#f59e0b', tool: '#22c55e', fault: '#8b5cf6' };

let simulation, svg, linkSel, nodeSel, w, h;

function initGraph() {
  const container = document.getElementById('graphPanel');
  const rect = container.getBoundingClientRect();
  w = rect.width; h = rect.height;

  svg = d3.select('#graphSvg');
  svg.selectAll('*').remove();

  const defs = svg.append('defs');
  defs.append('marker')
    .attr('id','arrowG')
    .attr('viewBox','0 0 10 10')
    .attr('refX',10).attr('refY',5)
    .attr('markerWidth',5).attr('markerHeight',5)
    .attr('orient','auto')
    .append('path').attr('d','M 0 0 L 10 5 L 0 10 z').attr('fill','#666');

  linkSel = svg.append('g').selectAll('path').data(graphLinks).join('path')
    .attr('class','link');

  nodeSel = svg.append('g').selectAll('g').data(graphNodes).join('g').attr('class','node');

  nodeSel.append('circle')
    .attr('r', d => d.size)
    .attr('fill', d => groupColors[d.group] + '22')
    .attr('stroke', d => groupColors[d.group]);

  nodeSel.append('text')
    .attr('dy', d => d.size + 12)
    .attr('text-anchor','middle')
    .text(d => d.label);

  nodeSel.on('mouseover', (event, d) => {
    const tip = document.getElementById('tooltip');
    tip.style.display = 'block';
    tip.style.left = (event.offsetX + 12) + 'px';
    tip.style.top = (event.offsetY - 12) + 'px';
    tip.innerHTML = `<b style="color:${groupColors[d.group]}">${d.label}</b><br><span style="color:#858585">${d.desc}</span>`;
  }).on('mouseout', () => {
    document.getElementById('tooltip').style.display = 'none';
  }).on('click', (event, d) => {
    showNodeDetail(d);
  });

  nodeSel.call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended));

  simulation = d3.forceSimulation(graphNodes)
    .force('link', d3.forceLink(graphLinks).id(d => d.id).distance(90).strength(0.5))
    .force('charge', d3.forceManyBody().strength(-300))
    .force('center', d3.forceCenter(w/2, h/2))
    .force('collision', d3.forceCollide().radius(d => d.size + 20))
    .force('x', d3.forceX(w/2).strength(0.05))
    .force('y', d3.forceY(h/2).strength(0.05))
    .on('tick', ticked);
}

function ticked() {
  const pad = 40;
  graphNodes.forEach(d => {
    d.x = Math.max(pad, Math.min(w - pad, d.x));
    d.y = Math.max(pad, Math.min(h - pad, d.y));
  });

  linkSel.attr('d', d => {
    const dx = d.target.x - d.source.x;
    const dy = d.target.y - d.source.y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const sr = d.source.size || 12;
    const tr = d.target.size || 12;
    const sx = d.source.x + (dx/dist) * sr;
    const sy = d.source.y + (dy/dist) * sr;
    const tx = d.target.x - (dx/dist) * (tr + 6);
    const ty = d.target.y - (dy/dist) * (tr + 6);
    return `M${sx},${sy}L${tx},${ty}`;
  });

  nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
}

function dragstarted(event) { if (!event.active) simulation.alphaTarget(0.3).restart(); event.subject.fx = event.subject.x; event.subject.fy = event.subject.y; }
function dragged(event) { event.subject.fx = event.x; event.subject.fy = event.y; }
function dragended(event) { if (!event.active) simulation.alphaTarget(0); event.subject.fx = null; event.subject.fy = null; }

function showNodeDetail(d) {
  document.getElementById('detailArea').innerHTML = `
    <div class="detail-card">
      <div class="detail-title" style="color:${groupColors[d.group]}">${d.label}</div>
      <div style="color:#cccccc;margin-top:4px">${d.desc}</div>
      <div style="color:#858585;margin-top:4px;font-size:10px">分组: ${d.group}</div>
    </div>`;
}

function setActiveBtn(id) {
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  if (id) document.getElementById(id).classList.add('active');
}

function showAll() {
  setActiveBtn('btnAll');
  nodeSel.select('circle').attr('opacity', 1);
  nodeSel.select('text').attr('opacity', 1);
  linkSel.attr('opacity', 1);
  document.getElementById('statusText').textContent = '全景视图: 拖拽探索 Agent Loop 架构';
}

function highlightFuses() {
  setActiveBtn('btnFuse');
  const fuseIds = ['fuse1','fuse2','fuse3','loop'];
  nodeSel.select('circle').attr('opacity', d => fuseIds.includes(d.id) ? 1 : 0.15);
  nodeSel.select('text').attr('opacity', d => fuseIds.includes(d.id) ? 1 : 0.2);
  linkSel.attr('opacity', d => fuseIds.includes(d.source.id) && fuseIds.includes(d.target.id) ? 1 : 0.08);
  document.getElementById('statusText').textContent = '三根保险丝: 死循环检测 + Token预算 + 截断恢复';
}

function highlightExits() {
  setActiveBtn('btnExit');
  const exitIds = graphNodes.filter(n => n.group === 'exit').map(n => n.id).concat('loop');
  nodeSel.select('circle').attr('opacity', d => exitIds.includes(d.id) ? 1 : 0.15);
  nodeSel.select('text').attr('opacity', d => exitIds.includes(d.id) ? 1 : 0.2);
  linkSel.attr('opacity', d => exitIds.includes(d.source.id) && exitIds.includes(d.target.id) ? 1 : 0.08);
  document.getElementById('statusText').textContent = '七种退出路径: completed/max_turns/abort/hook/blocking/prompt_too_long';
}

function resetHighlight() {
  setActiveBtn(null);
  showAll();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runSimulation() {
  const log = document.getElementById('simLog');
  log.innerHTML = '';
  document.getElementById('statusText').textContent = '模拟 Agent Loop 执行过程...';

  const steps = [
    { nodes: ['loop','fuse1'], msg: '保险丝1: 检查是否有重复调用...正常', cls: 'sim-active' },
    { nodes: ['loop','model'], msg: '调用模型 API (流式)', cls: 'sim-active' },
    { nodes: ['model','streaming'], msg: '流式解析: 收到 text + tool_use', cls: 'sim-active' },
    { nodes: ['streaming','toolexec'], msg: '工具执行器: read_file(src/index.ts)', cls: 'sim-ok' },
    { nodes: ['toolexec','concurrency'], msg: '并发调度: Read → 可并发', cls: 'sim-ok' },
    { nodes: ['toolexec','loop'], msg: '结果返回，进入下一轮', cls: 'sim-active' },
    { nodes: ['loop','fuse1'], msg: '保险丝1: 检查...同一文件读第2次', cls: 'sim-fuse' },
    { nodes: ['loop','fuse2'], msg: '保险丝2: Token 65% (9750/15000)', cls: 'sim-active' },
    { nodes: ['loop','model'], msg: '调用模型 (第3轮)', cls: 'sim-active' },
    { nodes: ['model','fuse3'], msg: '输出正常 (finishReason: stop)', cls: 'sim-ok' },
    { nodes: ['loop','exit_completed'], msg: '退出: end_turn → completed ✓', cls: 'sim-ok' },
  ];

  for (const step of steps) {
    nodeSel.select('circle')
      .attr('stroke-width', d => step.nodes.includes(d.id) ? 3.5 : 2)
      .attr('fill', d => step.nodes.includes(d.id) ? groupColors[d.group] + '44' : groupColors[d.group] + '22');

    linkSel.classed('link-active', d => step.nodes.includes(d.source.id) && step.nodes.includes(d.target.id));

    const entry = document.createElement('div');
    entry.className = `sim-entry ${step.cls}`;
    entry.textContent = step.msg;
    log.appendChild(entry);
    log.scrollTop = log.scrollHeight;

    await sleep(800);
  }

  nodeSel.select('circle').attr('stroke-width', 2).attr('fill', d => groupColors[d.group] + '22');
  linkSel.classed('link-active', false);
  document.getElementById('statusText').textContent = '模拟完成: 3轮循环后正常退出 (completed)';
}

setTimeout(initGraph, 100);
window.addEventListener('resize', () => {
  const rect = document.getElementById('graphPanel').getBoundingClientRect();
  w = rect.width; h = rect.height;
  if (simulation) {
    simulation.force('center', d3.forceCenter(w/2, h/2));
    simulation.force('x', d3.forceX(w/2).strength(0.05));
    simulation.force('y', d3.forceY(h/2).strength(0.05));
    simulation.alpha(0.3).restart();
  }
});
</script>
</body>
</html>
