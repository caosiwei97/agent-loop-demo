<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三层降级链 — DAG 拓扑图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e1e;color:#ccc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100%;padding:16px;gap:10px}
.title{color:#569cd6;font-size:16px;font-weight:600}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls button{background:#0e639c;color:#fff;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:12px}
.controls button:hover{background:#1177bb}
.controls .reset{background:#333;border:1px solid #555}
.controls .reset:hover{background:#444}
.hint{color:#6a9955;font-size:12px}
.body{display:flex;flex:1;gap:12px;overflow:hidden}
.graph{flex:2;border:1px solid #333;border-radius:6px;background:#1a1a2e;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:30px 0}
.sidebar{flex:1;border:1px solid #333;border-radius:6px;padding:12px;overflow-y:auto;min-width:200px;display:flex;flex-direction:column;gap:8px}
.sidebar-title{color:#569cd6;font-size:11px;border-bottom:1px solid #333;padding-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.log{padding:5px 8px;margin:2px 0;border-radius:3px;font-size:11px;font-family:monospace}
.log-l1{background:rgba(139,92,246,.08);border-left:2px solid #8b5cf6;color:#c4b5fd}
.log-l2{background:rgba(245,158,11,.08);border-left:2px solid #f59e0b;color:#fcd34d}
.log-l3{background:rgba(239,68,68,.08);border-left:2px solid #ef4444;color:#fca5a5}
.log-ok{background:rgba(34,197,94,.08);border-left:2px solid #22c55e;color:#86efac}
.log-info{background:rgba(78,201,176,.08);border-left:2px solid #4ec9b0;color:#a5d8ff}
.detail{padding:10px;border:1px solid #3a3a5c;border-radius:6px;background:#252526;font-size:11px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">三层降级链 — DAG 拓扑图</div>
  <div class="controls">
    <button onclick="runFail()">触发持续故障</button>
    <button onclick="runOk()">触发偶发故障（重试成功）</button>
    <button class="reset" onclick="reset()">重置</button>
    <span class="hint" id="hint">点击节点查看详情，或触发故障观察降级路径</span>
  </div>
  <div class="body">
    <div class="graph" id="graphArea"></div>
    <div class="sidebar">
      <div class="sidebar-title">执行日志</div>
      <div id="logs" style="flex:1;overflow-y:auto"></div>
      <div id="detail"></div>
    </div>
  </div>
</div>
<script>
// ─── Data ───
const NODES = [
  { id:'stream',   label:'流式请求',   sub:'stream: true', color:'#8b5cf6' },
  { id:'backoff1', label:'指数退避',   sub:'500ms×2^n',    color:'#8b5cf6' },
  { id:'non',      label:'非流式请求', sub:'timeout:120s', color:'#f59e0b' },
  { id:'backoff2', label:'退避重试',   sub:'继承失败预算', color:'#f59e0b' },
  { id:'model',    label:'模型降级',   sub:'Opus→Sonnet',  color:'#ef4444' },
  { id:'ok',       label:'成功',       sub:'返回结果',     color:'#22c55e' },
];

const EDGES = [
  { from:'stream',   to:'backoff1', label:'429/529' },
  { from:'backoff1', to:'non',      label:'连续失败' },
  { from:'non',      to:'backoff2', label:'529' },
  { from:'backoff2', to:'model',    label:'3次529' },
  { from:'model',    to:'ok',       label:'' },
  // right branches
  { from:'backoff1', to:'ok', label:'成功', branch:true },
  { from:'non',      to:'ok', label:'成功', branch:true },
];

const DETAILS = {
  stream:'通过 SSE 建立流式长连接。流式需要维持连接池，但用户体验好（逐字输出）。',
  backoff1:'基础退避 500ms，每次翻倍，加随机抖动。最多 10 次。优先使用 Retry-After 头。',
  non:'切换为一次性请求-响应。短连接对服务端更友好。超时 120 秒。',
  backoff2:'继承 Layer 1 的失败次数。两层失败预算连续计算。',
  model:'不同模型有独立算力配额。Opus 过载不代表 Sonnet 也过载。只改 model 字段。',
  ok:'请求成功返回。可能来自 Layer 1 退避成功、Layer 2 非流式成功、或 Layer 3 模型降级成功。',
};

// ─── Layout constants ───
const NW = 180, NH = 50, GAP_Y = 40, PORT_R = 5;
const CX = 140; // center x for main column
const MARGIN_TOP = 20;

// Calculate node positions: strict vertical, one column
function nodePos(idx) {
  return { x: CX, y: MARGIN_TOP + idx * (NH + GAP_Y) + NH / 2 };
}

// "成功" node is on the right, vertically centered
const OK_X = CX + 250;
const OK_Y = MARGIN_TOP + 2 * (NH + GAP_Y) + NH / 2; // aligned with row 2 (middle)

function getPos(id) {
  const idx = NODES.findIndex(n => n.id === id);
  if (id === 'ok') return { x: OK_X, y: OK_Y };
  return nodePos(idx);
}

// ─── State ───
let activeNodes = new Set();
let activeEdges = new Set();
let running = false;

// ─── Render ───
function render() {
  const svgW = OK_X + NW / 2 + 40;
  const svgH = MARGIN_TOP + NODES.length * (NH + GAP_Y) + 20;

  let svg = `<svg width="${svgW}" height="${svgH}" xmlns="http://www.w3.org/2000/svg" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">`;
  svg += `<defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,2L8,5L0,8z" fill="#555"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,2L8,5L0,8z" fill="#4a9eed"/></marker>
  </defs>`;

  // Draw edges
  EDGES.forEach(e => {
    const fp = getPos(e.from);
    const tp = getPos(e.to);
    const act = activeEdges.has(e.from+'->'+e.to);
    const stroke = act ? '#4a9eed' : '#555';
    const sw = act ? '2' : '1.5';
    const marker = act ? 'url(#b)' : 'url(#a)';

    let d, lx, ly;
    if (!e.branch) {
      // Straight vertical
      const sy = fp.y + NH/2;
      const ey = tp.y - NH/2;
      d = `M${fp.x},${sy} L${tp.x},${ey}`;
      lx = fp.x + 14; ly = (sy + ey) / 2 + 4;
      // Port circles
      svg += `<circle cx="${fp.x}" cy="${sy}" r="${PORT_R}" fill="#1a1a2e" stroke="${stroke}" stroke-width="1.5"/>`;
      svg += `<circle cx="${tp.x}" cy="${ey}" r="${PORT_R}" fill="#1a1a2e" stroke="${stroke}" stroke-width="1.5"/>`;
    } else {
      // Branch to right (to "ok" node)
      const sx = fp.x + NW/2;
      const sy = fp.y;
      const ex = tp.x - NW/2;
      const ey = tp.y;
      const midX = (sx + ex) / 2;
      d = `M${sx},${sy} C${midX},${sy} ${midX},${ey} ${ex},${ey}`;
      lx = midX; ly = (sy + ey) / 2 - 6;
      svg += `<circle cx="${sx}" cy="${sy}" r="${PORT_R}" fill="#1a1a2e" stroke="${stroke}" stroke-width="1.5"/>`;
      svg += `<circle cx="${ex}" cy="${ey}" r="${PORT_R}" fill="#1a1a2e" stroke="${stroke}" stroke-width="1.5"/>`;
    }

    svg += `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${sw}" marker-end="${marker}"/>`;
    if (e.label) {
      const lc = act ? '#a5d8ff' : '#666';
      svg += `<text x="${lx}" y="${ly}" fill="${lc}" font-size="10">${e.label}</text>`;
    }
  });

  // Draw nodes
  NODES.forEach(n => {
    const p = getPos(n.id);
    const act = activeNodes.has(n.id);
    const nx = p.x - NW/2, ny = p.y - NH/2;
    const fill = act ? n.color + '20' : '#2d2d2d';
    const borderColor = act ? n.color : '#3a3a5c';
    const bw = act ? '2' : '1';

    svg += `<g style="cursor:pointer" onclick="showDetail('${n.id}')">`;
    svg += `<rect x="${nx}" y="${ny}" width="${NW}" height="${NH}" rx="6" fill="${fill}" stroke="${borderColor}" stroke-width="${bw}"/>`;
    // Left color bar
    svg += `<rect x="${nx}" y="${ny}" width="4" height="${NH}" rx="2" fill="${n.color}"/>`;
    // Gear icon
    svg += `<text x="${nx+18}" y="${p.y+5}" fill="#888" font-size="14">⚙</text>`;
    // Label
    svg += `<text x="${nx+36}" y="${p.y-4}" fill="#e0e0e0" font-size="12" font-weight="500">${n.label}</text>`;
    // Sublabel
    svg += `<text x="${nx+36}" y="${p.y+12}" fill="#888" font-size="10">${n.sub}</text>`;
    // Status circle
    const scx = nx + NW - 20;
    const scolor = act ? n.color : '#555';
    svg += `<circle cx="${scx}" cy="${p.y}" r="9" fill="none" stroke="${scolor}" stroke-width="1.5"/>`;
    const icon = n.id === 'ok' ? '✓' : (act ? '▶' : '✓');
    svg += `<text x="${scx}" y="${p.y+4}" text-anchor="middle" fill="${scolor}" font-size="10" font-weight="bold">${icon}</text>`;
    svg += `</g>`;
  });

  svg += `</svg>`;
  document.getElementById('graphArea').innerHTML = svg;
}

function showDetail(id) {
  const n = NODES.find(n => n.id === id);
  document.getElementById('detail').innerHTML = `<div class="detail"><div style="color:${n.color};font-weight:600;margin-bottom:4px">⚙ ${n.label}</div><div style="color:#aaa">${DETAILS[id]}</div></div>`;
}

function hl(nodes, edges) {
  activeNodes = new Set(nodes);
  activeEdges = new Set(edges);
  render();
}

function addLog(t, c) {
  const d = document.createElement('div');
  d.className = 'log ' + c;
  d.textContent = t;
  document.getElementById('logs').appendChild(d);
  d.scrollIntoView({behavior:'smooth'});
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runFail() {
  if (running) return; running = true;
  document.getElementById('logs').innerHTML = '';
  document.getElementById('hint').textContent = '模拟持续故障...';

  hl(['stream'], []);
  addLog('发起流式请求...', 'log-info');
  await wait(600);

  hl(['stream','backoff1'], ['stream->backoff1']);
  addLog('[L1] 529 → 退避 500ms', 'log-l1');
  await wait(500);
  addLog('[L1] 529 → 退避 1000ms', 'log-l1');
  await wait(500);
  addLog('[L1] 529 → 连续失败', 'log-l1');
  await wait(400);

  hl(['backoff1','non'], ['backoff1->non']);
  addLog('[L1→L2] 切换非流式', 'log-l2');
  await wait(600);

  hl(['non','backoff2'], ['non->backoff2']);
  addLog('[L2] 529 × 3', 'log-l2');
  await wait(600);

  hl(['backoff2','model'], ['backoff2->model']);
  addLog('[L2→L3] Opus → Sonnet', 'log-l3');
  await wait(600);

  hl(['model','ok'], ['model->ok']);
  addLog('[L3] Sonnet 成功 ✓', 'log-ok');
  await wait(400);

  hl(['ok'], []);
  document.getElementById('hint').textContent = '完成: L1→L2→L3→成功';
  running = false;
}

async function runOk() {
  if (running) return; running = true;
  document.getElementById('logs').innerHTML = '';
  document.getElementById('hint').textContent = '模拟偶发故障...';

  hl(['stream'], []);
  addLog('发起流式请求...', 'log-info');
  await wait(600);

  hl(['stream','backoff1'], ['stream->backoff1']);
  addLog('[L1] 429 → 退避', 'log-l1');
  await wait(500);
  addLog('[L1] 429 → 退避', 'log-l1');
  await wait(500);

  hl(['backoff1','ok'], ['backoff1->ok']);
  addLog('[L1] 第3次成功 ✓ 无需降级', 'log-ok');
  await wait(400);

  hl(['ok'], []);
  document.getElementById('hint').textContent = 'L1 重试成功，无需降级';
  running = false;
}

function reset() {
  running = false;
  activeNodes = new Set();
  activeEdges = new Set();
  document.getElementById('logs').innerHTML = '';
  document.getElementById('detail').innerHTML = '';
  document.getElementById('hint').textContent = '点击节点查看详情，或触发故障观察降级路径';
  render();
}

render();
</script>
</body>
</html>
