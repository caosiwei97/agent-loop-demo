<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三层降级链 — DAG 拓扑图</title>
<script src="/vendor/d3.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e1e;color:#cccccc;font-family:'Courier New',monospace;overflow:hidden}
.container{display:flex;flex-direction:column;height:100%;padding:16px;gap:10px}
h2{color:#569cd6;font-size:16px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#0e639c;color:#fff;border:none;padding:7px 14px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
button:hover{background:#1177bb}
button:disabled{background:#333;color:#777;cursor:not-allowed}
.status{color:#6a9955;font-size:12px}
.main{display:flex;flex:1;gap:12px;overflow:hidden}
.dag-panel{flex:2;border:1px solid #333;border-radius:6px;overflow:hidden;position:relative}
.info-panel{flex:1;border:1px solid #333;border-radius:6px;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.panel-title{color:#569cd6;font-size:11px;margin-bottom:6px;border-bottom:1px solid #333;padding-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
svg{width:100%;height:100%}
.node-group{cursor:pointer}
.node-rect{rx:8;ry:8;stroke-width:2;transition:fill .5s,stroke .5s}
.node-label{font-size:11px;fill:#cccccc;text-anchor:middle;pointer-events:none}
.node-sublabel{font-size:9px;fill:#858585;text-anchor:middle;pointer-events:none}
.edge-path{fill:none;stroke:#555;stroke-width:1.5}
.edge-label{font-size:9px;fill:#858585}
.log-entry{padding:4px 8px;margin:2px 0;border-radius:2px;font-size:11px;animation:fadeIn .3s}
.log-l1{background:rgba(139,92,246,0.1);border-left:2px solid #8b5cf6;color:#c4b5fd}
.log-l2{background:rgba(245,158,11,0.1);border-left:2px solid #f59e0b;color:#ffd8a8}
.log-l3{background:rgba(239,68,68,0.1);border-left:2px solid #ef4444;color:#ffc9c9}
.log-ok{background:rgba(34,197,94,0.1);border-left:2px solid #22c55e;color:#b2f2bb}
.log-info{background:rgba(86,156,214,0.1);border-left:2px solid #4a9eed;color:#a5d8ff}
.detail-card{padding:8px;border:1px solid #444;border-radius:4px;background:#252526;font-size:11px}
.detail-title{font-weight:bold;margin-bottom:4px}
.legend{display:flex;gap:12px;font-size:10px;color:#858585;position:absolute;bottom:8px;left:8px}
.legend-item{display:flex;align-items:center;gap:4px}
.legend-dot{width:10px;height:10px;border-radius:3px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.4)}}
</style>
</head>
<body>
<div class="container">
  <h2>三层降级链 — DAG 拓扑图</h2>
  <div class="controls">
    <button id="btnTrigger" onclick="triggerFailure()">触发持续故障</button>
    <button onclick="triggerSuccess()">触发偶发故障(重试成功)</button>
    <button onclick="resetAll()">重置</button>
    <span class="status" id="statusText">点击节点查看详情，或触发故障观察降级路径</span>
  </div>
  <div class="main">
    <div class="dag-panel">
      <svg id="dagSvg"></svg>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#8b5cf6"></div>Layer 1: 流式重试</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f59e0b"></div>Layer 2: 非流式</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ef4444"></div>Layer 3: 模型降级</div>
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>成功</div>
      </div>
    </div>
    <div class="info-panel">
      <div class="panel-title">执行日志</div>
      <div id="logArea" style="flex:1;overflow-y:auto"></div>
      <div id="detailArea"></div>
    </div>
  </div>
</div>
<script>
const NW = 100, NH = 44;

const nodes = [
  { id: 'request',     col: 0, row: 1, label: '请求',       sub: 'API Call',     color: '#4a9eed' },
  { id: 'stream',      col: 1, row: 0, label: '流式请求',   sub: 'stream: true', color: '#8b5cf6' },
  { id: 'backoff',     col: 2, row: 0, label: '指数退避',   sub: '500ms×2^n',    color: '#8b5cf6' },
  { id: 'nonstream',   col: 1, row: 2, label: '非流式请求', sub: 'timeout:120s', color: '#f59e0b' },
  { id: 'backoff2',    col: 2, row: 2, label: '退避重试',   sub: '继承失败预算', color: '#f59e0b' },
  { id: 'modelswitch', col: 3, row: 1, label: '模型降级',   sub: 'Opus→Sonnet',  color: '#ef4444' },
  { id: 'success',     col: 4, row: 1, label: '成功',       sub: '返回结果',     color: '#22c55e' },
];

const edges = [
  { from: 'request',   to: 'stream',      label: '' },
  { from: 'stream',    to: 'backoff',     label: '429/529' },
  { from: 'backoff',   to: 'stream',      label: '重试',     loop: true },
  { from: 'backoff',   to: 'success',     label: '成功' },
  { from: 'backoff',   to: 'nonstream',   label: '连续失败' },
  { from: 'nonstream', to: 'backoff2',    label: '529' },
  { from: 'backoff2',  to: 'nonstream',   label: '重试',     loop: true },
  { from: 'backoff2',  to: 'modelswitch', label: '3次529' },
  { from: 'nonstream', to: 'success',     label: '成功' },
  { from: 'modelswitch', to: 'success',   label: '' },
];

const nodeDetails = {
  request: '发起 API 请求。默认使用流式模式。',
  stream: '通过 SSE 建立长连接。流式需要维持连接池，对服务端压力更大。',
  backoff: '基础退避 500ms，每次翻倍。加随机抖动防止"重试风暴"。最多重试 10 次。优先使用 Retry-After 头。',
  nonstream: '切换为一次性请求-响应。变成短连接，对服务端更友好。超时 120 秒。',
  backoff2: '继承 Layer 1 的失败次数。两层的失败预算是连续的，不是各算各的。',
  modelswitch: '不同模型通常有独立的算力配额。Opus 过载不代表 Sonnet 也过载。只改 model 字段，上下文不需要重建。',
  success: '请求成功返回。可能来自任何一层。',
};

let svg, gNodes, gEdges, w, h;
let activeNodes = new Set();
let animRunning = false;

function getNodePos(n) {
  const padX = 70, padY = 60;
  const cellW = (w - padX * 2 - NW) / 4;
  const cellH = (h - padY * 2 - NH) / 2;
  return {
    x: padX + n.col * cellW + NW/2,
    y: padY + n.row * cellH + NH/2
  };
}

function initDag() {
  const container = document.querySelector('.dag-panel');
  const rect = container.getBoundingClientRect();
  w = rect.width; h = rect.height;

  svg = d3.select('#dagSvg');
  svg.selectAll('*').remove();

  const defs = svg.append('defs');
  defs.append('marker').attr('id','arrow').attr('viewBox','0 0 10 10')
    .attr('refX',9).attr('refY',5)
    .attr('markerWidth',7).attr('markerHeight',7)
    .attr('orient','auto')
    .append('path').attr('d','M 0 1 L 9 5 L 0 9 z').attr('fill','#888');

  defs.append('marker').attr('id','arrowActive').attr('viewBox','0 0 10 10')
    .attr('refX',9).attr('refY',5)
    .attr('markerWidth',7).attr('markerHeight',7)
    .attr('orient','auto')
    .append('path').attr('d','M 0 1 L 9 5 L 0 9 z').attr('fill','#4a9eed');

  gEdges = svg.append('g');
  gNodes = svg.append('g');

  drawEdges();
  drawNodes();
}

function edgePath(e) {
  const fromNode = nodes.find(n => n.id === e.from);
  const toNode = nodes.find(n => n.id === e.to);
  const fp = getNodePos(fromNode);
  const tp = getNodePos(toNode);

  if (e.loop) {
    const isTop = fromNode.row === 0;
    const offsetY = isTop ? -32 : 32;
    const mx = (fp.x + tp.x) / 2;
    const my = fp.y + offsetY;
    const sx = fp.x - NW/2 + 10;
    const ex = tp.x + NW/2 - 10;
    const sy = fp.y + (isTop ? -NH/2 : NH/2);
    const ey = tp.y + (isTop ? -NH/2 : NH/2);
    return { path: `M${sx},${sy} C${sx},${my} ${ex},${my} ${ex},${ey}`, lx: mx, ly: my + (isTop ? -8 : 12) };
  }

  const dx = tp.x - fp.x;
  const dy = tp.y - fp.y;
  const adx = Math.abs(dx), ady = Math.abs(dy);

  let sx, sy, ex, ey;
  if (adx > ady) {
    sx = fp.x + (dx > 0 ? NW/2 : -NW/2);
    sy = fp.y;
    ex = tp.x + (dx > 0 ? -NW/2 - 4 : NW/2 + 4);
    ey = tp.y;
  } else {
    sx = fp.x;
    sy = fp.y + (dy > 0 ? NH/2 : -NH/2);
    ex = tp.x;
    ey = tp.y + (dy > 0 ? -NH/2 - 4 : NH/2 + 4);
  }

  if (adx > 10 && ady > 10) {
    const mx = (sx + ex) / 2;
    const my = (sy + ey) / 2;
    return { path: `M${sx},${sy} Q${mx},${sy} ${ex},${ey}`, lx: mx + 4, ly: (sy + ey)/2 - 8 };
  }

  const lx = (sx + ex) / 2;
  const ly = (sy + ey) / 2 - 8;
  return { path: `M${sx},${sy} L${ex},${ey}`, lx, ly };
}

function drawEdges() {
  gEdges.selectAll('*').remove();
  edges.forEach(e => {
    const { path, lx, ly } = edgePath(e);
    const isActive = activeNodes.has(e.from) && activeNodes.has(e.to);
    gEdges.append('path')
      .attr('d', path)
      .attr('class','edge-path')
      .attr('stroke', isActive ? '#4a9eed' : '#555')
      .attr('stroke-width', isActive ? 2.5 : 1.5)
      .attr('marker-end', isActive ? 'url(#arrowActive)' : 'url(#arrow)')
      .attr('data-from', e.from).attr('data-to', e.to);

    if (e.label) {
      gEdges.append('text')
        .attr('x', lx).attr('y', ly)
        .attr('class','edge-label')
        .attr('text-anchor','middle')
        .attr('fill', isActive ? '#a5d8ff' : '#858585')
        .text(e.label);
    }
  });
}

function drawNodes() {
  gNodes.selectAll('*').remove();
  nodes.forEach(n => {
    const pos = getNodePos(n);
    const g = gNodes.append('g')
      .attr('class','node-group')
      .attr('transform', `translate(${pos.x},${pos.y})`)
      .attr('data-id', n.id)
      .on('click', () => showDetail(n.id));

    const isActive = activeNodes.has(n.id);
    g.append('rect')
      .attr('class','node-rect')
      .attr('x', -NW/2).attr('y', -NH/2)
      .attr('width', NW).attr('height', NH)
      .attr('fill', isActive ? n.color + '33' : '#252526')
      .attr('stroke', isActive ? n.color : '#444');

    if (isActive) {
      g.select('.node-rect').style('animation', 'glow 1.5s infinite');
    }

    g.append('text').attr('class','node-label').attr('y', -3).text(n.label);
    g.append('text').attr('class','node-sublabel').attr('y', 12).text(n.sub);
  });
}

function highlightPath(nodeIds) {
  activeNodes = new Set(nodeIds);
  drawEdges();
  drawNodes();
}

function showDetail(nodeId) {
  const detail = nodeDetails[nodeId];
  const node = nodes.find(n => n.id === nodeId);
  document.getElementById('detailArea').innerHTML = `
    <div class="detail-card">
      <div class="detail-title" style="color:${node.color}">${node.label}</div>
      <div style="color:#858585;margin-top:4px">${detail}</div>
    </div>`;
}

function addLog(text, cls) {
  const el = document.createElement('div');
  el.className = `log-entry ${cls}`;
  el.textContent = text;
  document.getElementById('logArea').appendChild(el);
  el.scrollIntoView({behavior:'smooth'});
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function triggerFailure() {
  if (animRunning) return;
  animRunning = true;
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('statusText').textContent = '模拟持续故障，观察三层降级...';

  highlightPath(['request','stream']);
  addLog('发起流式请求...', 'log-info');
  await sleep(500);

  for (let i = 1; i <= 4; i++) {
    highlightPath(['stream','backoff']);
    const delay = 500 * Math.pow(2, i-1);
    addLog(`[L1] 第 ${i} 次: 529 Overloaded → 退避 ${delay}ms`, 'log-l1');
    await sleep(400);
  }

  addLog('[L1] 连续失败 → 升级到 Layer 2', 'log-l1');
  await sleep(300);

  highlightPath(['backoff','nonstream']);
  addLog('[L2] 切换非流式请求 (短连接，对服务端更友好)', 'log-l2');
  await sleep(500);

  for (let i = 1; i <= 3; i++) {
    highlightPath(['nonstream','backoff2']);
    addLog(`[L2] 非流式第 ${i} 次: 529 Site Overloaded`, 'log-l2');
    await sleep(400);
  }

  addLog('[L2] 连续 3 次 529 → 升级到 Layer 3', 'log-l2');
  await sleep(300);

  highlightPath(['backoff2','modelswitch']);
  addLog('[L3] 切换模型: Opus → Sonnet', 'log-l3');
  addLog('[L3] 保留完整上下文，只改 model 字段', 'log-l3');
  await sleep(600);

  highlightPath(['modelswitch','success']);
  addLog('[L3] Sonnet 响应成功! ✓', 'log-ok');
  await sleep(300);

  highlightPath(['success']);
  document.getElementById('statusText').textContent = '三层降级完成: L1流式重试→L2非流式→L3模型降级→成功';
  animRunning = false;
}

async function triggerSuccess() {
  if (animRunning) return;
  animRunning = true;
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('statusText').textContent = '模拟偶发故障，Layer 1 重试成功...';

  highlightPath(['request','stream']);
  addLog('发起流式请求...', 'log-info');
  await sleep(500);

  highlightPath(['stream','backoff']);
  addLog('[L1] 第 1 次: 429 Too Many Requests → 退避 500ms', 'log-l1');
  await sleep(500);

  highlightPath(['backoff','stream']);
  addLog('[L1] 重试...', 'log-l1');
  await sleep(400);

  highlightPath(['stream','backoff']);
  addLog('[L1] 第 2 次: 429 → 退避 1000ms', 'log-l1');
  await sleep(500);

  highlightPath(['backoff','success']);
  addLog('[L1] 第 3 次: 成功! ✓', 'log-ok');
  addLog('偶发故障通过 Layer 1 重试解决，无需降级', 'log-ok');
  await sleep(300);

  highlightPath(['success']);
  document.getElementById('statusText').textContent = 'Layer 1 重试成功: 偶发故障不需要降级';
  animRunning = false;
}

function resetAll() {
  animRunning = false;
  activeNodes = new Set();
  document.getElementById('logArea').innerHTML = '';
  document.getElementById('detailArea').innerHTML = '';
  document.getElementById('statusText').textContent = '点击节点查看详情，或触发故障观察降级路径';
  drawEdges();
  drawNodes();
}

window.addEventListener('resize', () => {
  const rect = document.querySelector('.dag-panel').getBoundingClientRect();
  w = rect.width; h = rect.height;
  drawEdges();
  drawNodes();
});
setTimeout(initDag, 50);
</script>
</body>
</html>
