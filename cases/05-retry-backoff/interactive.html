<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>指数退避重试可视化</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#1e1e1e;color:#cccccc;font-family:'Courier New',monospace;overflow:hidden}
.container{display:flex;flex-direction:column;height:100%;padding:16px;gap:12px}
h2{color:#569cd6;font-size:16px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{background:#0e639c;color:#fff;border:none;padding:8px 18px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:13px}
button:hover{background:#1177bb}
button:disabled{background:#333;color:#777;cursor:not-allowed}
button.danger{background:#8b0000}
button.danger:hover{background:#a00000}
.status{color:#6a9955;font-size:12px}
.main{display:flex;flex:1;gap:12px;overflow:hidden}
.panel{flex:1;border:1px solid #333;border-radius:6px;padding:12px;overflow-y:auto;font-size:13px}
.panel-title{color:#569cd6;font-size:12px;margin-bottom:8px;border-bottom:1px solid #333;padding-bottom:4px}
.attempt{padding:6px 8px;margin:4px 0;border-radius:3px;display:flex;align-items:center;gap:8px}
.attempt-fail{background:#3c1a1a;border-left:3px solid #f44747}
.attempt-ok{background:#1a3c1a;border-left:3px solid #22c55e}
.attempt-waiting{background:#2a2a1a;border-left:3px solid #f59e0b}
.attempt-num{color:#569cd6;font-weight:bold;min-width:60px}
.attempt-delay{color:#f59e0b;min-width:80px}
.attempt-result{color:#cccccc}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;border-bottom:1px solid #333}
.bar-wrapper{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar{background:#0e639c;border-radius:3px 3px 0 0;transition:height .5s;min-width:30px;position:relative}
.bar-label{font-size:11px;color:#858585}
.bar-value{font-size:11px;color:#dcdcaa}
.comparison{margin-top:12px}
.comp-row{display:flex;gap:12px;margin:6px 0;align-items:center}
.comp-label{min-width:100px;color:#858585;font-size:12px}
.comp-bar-container{flex:1;height:20px;background:#333;border-radius:3px;overflow:hidden}
.comp-bar{height:100%;border-radius:3px;transition:width .5s}
</style>
</head>
<body>
<div class="container">
  <div>
    <h2>指数退避重试可视化</h2>
    <div class="controls">
      <button onclick="simulateRetry()">模拟 529 错误</button>
      <button onclick="simulateSuccess()">模拟成功响应</button>
      <button class="danger" onclick="resetAll()">重置</button>
      <span id="statusText" class="status">点击按钮开始模拟</span>
    </div>
  </div>
  <div class="main">
    <div class="panel">
      <div class="panel-title">📊 重试时间线</div>
      <div id="timeline"></div>
      <div class="comparison">
        <div class="panel-title" style="margin-top:12px">策略对比</div>
        <div id="comparison"></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-title">📈 延迟增长图</div>
      <div class="bar-chart" id="barChart"></div>
      <div style="margin-top:16px">
        <div class="panel-title">延迟数据</div>
        <div id="delayTable" style="font-size:12px"></div>
      </div>
    </div>
  </div>
</div>
<script>
let attempts = [], running = false;
function getDelay(attempt) {
  const base = 500;
  const exp = base * Math.pow(2, attempt);
  const jitter = Math.random() * exp * 0.25;
  return Math.min(exp + jitter, 30000);
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function addTimelineEntry(num, delay, result, isError) {
  const div = document.createElement('div');
  div.className = `attempt ${isError ? 'attempt-fail' : 'attempt-ok'}`;
  div.innerHTML = `<span class="attempt-num">#${num}</span>
    <span class="attempt-delay">${delay > 0 ? delay + 'ms' : '-'}</span>
    <span class="attempt-result">${result}</span>`;
  document.getElementById('timeline').appendChild(div);
  div.scrollIntoView({behavior:'smooth'});
}
function updateBarChart() {
  const chart = document.getElementById('barChart');
  chart.innerHTML = '';
  const maxDelay = attempts.length > 0 ? Math.max(...attempts.map(a => a.delay)) : 1000;
  attempts.forEach((a,i) => {
    const w = document.createElement('div');
    w.className = 'bar-wrapper';
    const h = Math.max((a.delay / maxDelay) * 140, 8);
    const color = a.success ? '#22c55e' : '#0e639c';
    w.innerHTML = `<div class="bar-value">${Math.round(a.delay)}ms</div>
      <div class="bar" style="height:${h}px;background:${color}"></div>
      <div class="bar-label">#${i+1}</div>`;
    chart.appendChild(w);
  });
}
function updateDelayTable() {
  const t = document.getElementById('delayTable');
  let html = '<div style="color:#858585;margin-bottom:4px">重试次数 | 延迟(ms) | 累计等待(ms)</div>';
  let total = 0;
  attempts.forEach((a,i) => {
    total += a.delay;
    const color = a.success ? '#4ec9b0' : '#f59e0b';
    html += `<div><span style="color:#569cd6">${String(i+1).padStart(4)}</span> | <span style="color:${color}">${String(Math.round(a.delay)).padStart(8)}</span> | <span style="color:#dcdcaa">${String(Math.round(total)).padStart(10)}</span></div>`;
  });
  t.innerHTML = html;
}
function updateComparison() {
  const c = document.getElementById('comparison');
  const n = attempts.length;
  if(n === 0) { c.innerHTML = ''; return; }
  let html = '';
  const maxDelay = 32000;
  // 固定间隔
  const fixedTotal = n * 1000;
  html += `<div class="comp-row"><span class="comp-label">固定间隔(1s)</span>
    <div class="comp-bar-container"><div class="comp-bar" style="width:${Math.min(fixedTotal/maxDelay*100,100)}%;background:#f44747"></div></div>
    <span style="color:#f44747;font-size:12px">${fixedTotal}ms</span></div>`;
  // 指数退避
  let expTotal = 0;
  for(let i=0;i<n;i++) expTotal += 500 * Math.pow(2,i);
  html += `<div class="comp-row"><span class="comp-label">指数退避</span>
    <div class="comp-bar-container"><div class="comp-bar" style="width:${Math.min(expTotal/maxDelay*100,100)}%;background:#f59e0b"></div></div>
    <span style="color:#f59e0b;font-size:12px">${Math.round(expTotal)}ms</span></div>`;
  // 实际(含抖动)
  const actualTotal = attempts.reduce((s,a)=>s+a.delay,0);
  html += `<div class="comp-row"><span class="comp-label">退避+抖动</span>
    <div class="comp-bar-container"><div class="comp-bar" style="width:${Math.min(actualTotal/maxDelay*100,100)}%;background:#22c55e"></div></div>
    <span style="color:#22c55e;font-size:12px">${Math.round(actualTotal)}ms</span></div>`;
  c.innerHTML = html;
}
async function simulateRetry() {
  if(running) return;
  running = true;
  document.getElementById('statusText').textContent = '模拟 529 错误...';
  for(let i = 0; i < 5; i++) {
    const delay = getDelay(i);
    attempts.push({ delay, success: false });
    if(i < 4) {
      addTimelineEntry(i+1, Math.round(delay), `529 Overloaded → 等待 ${Math.round(delay)}ms`, true);
    } else {
      addTimelineEntry(i+1, Math.round(delay), `529 Overloaded → 放弃 (已达上限)`, true);
    }
    updateBarChart();
    updateDelayTable();
    updateComparison();
    // 加速模拟
    await sleep(Math.min(delay / 5, 600));
  }
  document.getElementById('statusText').textContent = '模拟完成: 连续 5 次 529，需要考虑降级';
  running = false;
}
async function simulateSuccess() {
  if(running) return;
  running = true;
  document.getElementById('statusText').textContent = '模拟重试后成功...';
  // 先失败 2 次
  for(let i = 0; i < 2; i++) {
    const delay = getDelay(i);
    attempts.push({ delay, success: false });
    addTimelineEntry(attempts.length, Math.round(delay), `429 Too Many Requests → 等待`, true);
    updateBarChart(); updateDelayTable(); updateComparison();
    await sleep(Math.min(delay / 5, 400));
  }
  // 第 3 次成功
  const delay = getDelay(2);
  attempts.push({ delay, success: true });
  addTimelineEntry(attempts.length, Math.round(delay), `✅ 成功! 模型返回正常响应`, false);
  updateBarChart(); updateDelayTable(); updateComparison();
  document.getElementById('statusText').textContent = '模拟完成: 第 3 次重试成功';
  running = false;
}
function resetAll() {
  running = false; attempts = [];
  document.getElementById('timeline').innerHTML = '';
  document.getElementById('barChart').innerHTML = '';
  document.getElementById('delayTable').innerHTML = '';
  document.getElementById('comparison').innerHTML = '';
  document.getElementById('statusText').textContent = '点击按钮开始模拟';
}
</script>
</body>
</html>
